name: Update nix-darwin Options

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  update-options:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate options.json
        run: .github/update.sh --repo https://github.com/nix-darwin/nix-darwin

      - name: Check if options.json changed
        id: check_changes
        run: |
          if git diff --quiet public/data/options.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/options.json
          git commit -m "chore: update nix-darwin options"
          git push

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update nix-darwin options"
          title: "chore: update nix-darwin options"
          body: |
            Automated update of nix-darwin options from the upstream repository.

            Run at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: chore/update-options
          delete-branch: true
